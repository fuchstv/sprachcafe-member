name: Build & Release SprachCafe Member Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status (completed, draft, inProgress, halted)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Member APK & AAB
    runs-on: ubuntu-latest
    env:
      HAVE_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK & App Bundle (AAB)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sprachcafe2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sprachcafe2026' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Build Artifacts (APK, AAB & Symbols)
        uses: actions/upload-artifact@v4
        with:
          name: sprachcafe-member-release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SprachCafé Mitglied v1.0.0 (${{ github.run_number }})
          body: |
            ### ☕ SprachCafé Polnisch e.V. — Offizielle Mitglieder-App & Digitaler Ausweis (API 36 Ready)

            **Pakete in diesem Release:**
            * 📦 **app-release.aab:** Signiertes Android App Bundle für die Google Play Console (Target SDK 36 / Android 16 ready, inkl. R8 De-obfuscation & Native Symbols)
            * 📲 **app-release.apk:** Signiertes APK-Installationspaket für sofortige Installation auf dem Smartphone.
            * 🗺️ **mapping.txt:** R8 / ProGuard Mapping-Datei zur De-Obfuskierung von Stacktraces.

            **Funktionen & Highlights:**
            * 🎯 **Google Play Ziel-SDK 36 (Android 16):** Erfüllt 100% der aktuellen Play Console Richtlinien.
            * 🛡️ **R8 Code-Optimierung & Schutz:** Kleineres Paket, optimierte Performance & beigefügte Offenlegungsdatei.
            * 💳 **Digitaler Mitgliedsausweis:** Vorteilskarte im edlen Vereinsdesign (Silver, Gold, Platinum, Firmen).
            * ☕ **Live-Kaffeekontingent:** Automatischer Fortschrittsbalken & Abrechnung an der Café-Theke.
            * 🔍 **Vollbild-QR-Code:** Maximale Helligkeit & Lesbarkeit für Thekenscanner und Hausbibliothek.
            * 💳 **Google Wallet Integration:** 1-Klick-Export des digitalen Passes direkt in Google Wallet.
            * 🔐 **Magic-Link-Login:** Sichere Aktivierung über persönlichen Einladungslink per E-Mail.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Google Play Console
        if: ${{ env.HAVE_PLAY_KEY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: org.sprachcafe.member
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Notice on Google Play Console deployment
        if: ${{ env.HAVE_PLAY_KEY != 'true' }}
        run: |
          echo "::notice title=Google Play Deployment Skipped::Secret PLAY_SERVICE_ACCOUNT_KEY is not configured in repository settings. See PLAY_CONSOLE_GUIDE.md to activate automated releases."

